# Per-user channel proxy in front of a single-key Hermes API server.
#
# Render the master key in and install:
#   export HERMES_UPSTREAM_KEY="<API_SERVER_KEY>"
#   envsubst '$HERMES_UPSTREAM_KEY' < deploy/nginx.conf > /etc/nginx/conf.d/hermes.conf
#   nginx -t && nginx -s reload
#
# Terminate TLS with certbot: certbot --nginx -d hermes.example.com

# Issued per-user tokens (the extension's "API key"). Map each to a label;
# the default 0 means "unknown token -> reject". Add/remove users here.
map $http_authorization $hermes_user {
    default                              0;
    "Bearer tok_alice_REPLACE_ME"        alice;
    "Bearer tok_bob_REPLACE_ME"          bob;
}

server {
    listen 443 ssl;
    server_name hermes.example.com;

    # ssl_certificate     /etc/letsencrypt/live/hermes.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hermes.example.com/privkey.pem;

    location / {
        # Reject any token not in the map above.
        if ($hermes_user = 0) {
            return 401;
        }

        # Swap the user's token for the upstream master key.
        proxy_set_header Authorization "Bearer ${HERMES_UPSTREAM_KEY}";
        proxy_pass http://127.0.0.1:8642;

        # --- SSE: stream /v1/chat/completions and /v1/runs/{id}/events --------
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;   # Runs can stream for minutes
    }

    # Don't write bearer tokens to the access log.
    access_log off;
}
