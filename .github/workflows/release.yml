name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build & package
        run: npm run package

      - name: Publish GitHub release with the packaged extension
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
